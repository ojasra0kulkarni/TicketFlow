{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
    body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f7fa;
  font-family: 'Poppins',sans-serif;
  position: relative;
}

.blob{
  position: absolute;
  width:150vh;
  height:130vh;
  background: linear-gradient(135deg, #2563eb, #6fd6b1);
  border-radius: 60% 40% 70% 30% / 40% 60% 30% 70%;  
  z-index: 0;
}

.container{
  position:relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  width: 70%;
  height: 70%;
  max-width: 1100px;
  min-height: 550px;
  border-radius: 10px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  z-index: 1;

}
.image{
  flex:2;
  
}
.login{
  margin-bottom: 50px;
  padding-bottom: 40px;
  flex:1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px;
  color: gray;
}
.input-box {
  margin-bottom: 20px;
}

.input-box input {
  width: 90%;
  padding: 12px 15px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  transition: 0.3s ease;
  font-family: 'Poppins', sans-serif;   
}
.input-box input::placeholder {
  font-family: 'Poppins', sans-serif;   /* same font in placeholder */
  color: #9ca3af;
}
.input-box input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #2563eb, #6fd6b1);
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.3s ease;
  margin-top: 10px;
}

button:hover {
  opacity: 0.9;
  transform: translateY(-2px);
}

.Register {
  display: block;
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  text-decoration: none;
  color: #2563eb;
}

.Register:hover {
  text-decoration: underline;
}
.identification{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
  margin-top:15px;
}


    </style>
  </head>
  <body>
    <div class= "blob"></div>
    <div class= "container">
      <div class ="image" style="height: 100%;">
        <img src = {% static "accounts/images/login.jpeg" %} class="left-image" style="width: 100%;height: 100%;object-fit:contain;">
      </div>
      <div class ="login">
        <h2 style="font-size: 38px; font-weight: 300; color: black; margin-bottom: 5px;">Welcome Back :)</h2>
        <p style=" margin: 0px 0px 20px 0px">Please login with your email and password</p>
        
        <form method="POST">
          {% csrf_token %}

          <div class="input-box">
            <input type="text" name="username" placeholder="Enter your username" required>
          </div>
          <div class="input-box">
            <input type="password" name="password" placeholder="Password" required>
          </div>
          <button type="submit">Login</button>
          <a href="/accounts/register/" class="Register">
          Create an account
          </a>
        </form>
        {% if error %}
          <p style="color:red;">{{ error }}</p>
        {% endif %}
        <div class = identification style="display: flex;font-size: small;justify-content: space-between;
          margin-top: 20px; margin-bottom: 20px;">
            <div>
              <label>
                <input type="checkbox">Remember Me
              </label>
            </div>
            <div>
              <a href="#">Forget Password?</a>
            </div>
          </div>
      </div>
      
  

    </div>

  
  </body>
</html>
