<!DOCTYPE html>
<html>
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
    body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f7fa;
  font-family: 'Poppins',sans-serif;
}

.blob{
  position: absolute;
  width:150vh;
  height:130vh;
  background: linear-gradient(135deg, #2563eb, #6fd6b1);
  border-radius: 60% 40% 70% 30% / 40% 60% 30% 70%;  
  z-index: 0;
}

.container{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  width: 70%;
  height: 70%;
  border-radius: 10px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  z-index: 1;
}
.image{
  flex:2;
  
}
.login{
  margin-bottom: 50px;
  padding-bottom: 40px;
  flex:1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px;
  color: gray;
}
.input-box{

}


    </style>
  </head>
  <body>
    <div class= "blob"></div>
    <div class= "container">
      <div class ="image" style="height: 100%;">
        <img src = "login.jpeg" class="left-image" style="width: 100%;height: 100%;object-fit:contain;">

      </div>
      <div class ="login">
        <h2 style="font-size: 38px; font-weight: 300; color: black; margin-bottom: 5px;">Welcome Back :)</h2>
        <p style=" margin: 0px 0px 20px 0px">Please login with your email and password</p>
        <div class="input-box">
          <input type="email" id="email" placeholder="Email Address">
          <div class="error" id="emailerror"></div>
        </div>
        <div class="input-box">
          <input type="password" id="password" placeholder="Password">
          <div class="error" id="passerror"></div>
        </div>
        <div class = identification style="display: flex;font-size: small;justify-content: space-between;
        margin-top: 20px; margin-bottom: 20px;">
          <div>
            <label>
              <input type="checkbox">Remember Me
            </label>
          </div>
          <div>
            <a href="#">Forget Password?</a>
          </div>
        </div>
        <div class="submit" style="display: flex; justify-content: left; ">
          <button onclick="validateLogin()">Login</button>
          <button><a href="#">Create account</a></button>

        </div>

      </div>

    </div>
    <script scr = "script.js"></script>
    
  </body>
</html>
